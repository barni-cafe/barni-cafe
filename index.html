<!DOCTYPE html>
<html lang="ar" dir="rtl">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

/* =========================
   GENERAL
========================= */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:#f6f0e8;
    color:#302720;
    font-family:Arial,Tahoma,sans-serif;
}

button,
input,
textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none !important;
}


/* =========================
   PAGES
========================= */

/*
   مهم جدًا:
   نخفي كل الصفحات بالقوة،
   ونظهر صفحة واحدة فقط.
*/

.page{
    display:none !important;
    min-height:100vh;
}

.page.active{
    display:block !important;
}

.page.active.confirm-page{
    display:flex !important;
}


/* =========================
   HOME
========================= */

.home{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:45px 18px 25px;
}

.language{
    position:fixed;
    top:18px;
    left:18px;
    z-index:50;

    border:1px solid #dfd2c4;
    background:#fffaf5;
    color:#302720;

    padding:9px 15px;
    border-radius:30px;

    font-weight:800;

    box-shadow:0 5px 20px rgba(60,40,25,.08);
}

.brand{
    text-align:center;
    margin-top:40px;
    margin-bottom:65px;

    animation:fadeLogo 2.5s ease forwards;
}

.brand-name{
    font-size:82px;
    font-weight:900;
    margin:0;
    letter-spacing:-5px;
}

.brand-subtitle{
    font-size:18px;
    color:#a69586;
    margin-top:-5px;
}

@keyframes fadeLogo{

    0%{
        opacity:0;
        transform:translateY(15px);
    }

    100%{
        opacity:1;
        transform:translateY(0);
    }

}

.home-options{
    width:min(650px,100%);

    display:flex;
    flex-direction:column;
    gap:22px;
}

.mode-button{
    width:100%;

    border:1px solid #e2d5c7;
    background:#fffaf5;

    border-radius:34px;

    padding:25px 28px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    color:#302720;

    box-shadow:0 15px 35px rgba(60,40,25,.07);

    transition:.25s;

    text-align:right;
}

.mode-button:hover{
    transform:translateY(-4px);
}

.mode-icon{
    width:68px;
    height:68px;

    border-radius:23px;

    background:#eee4d8;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:35px;

    flex-shrink:0;
}

.mode-text{
    flex:1;
    padding-right:20px;
}

.mode-text h2{
    margin:0 0 5px;
    font-size:26px;
}

.mode-text p{
    margin:0;
    color:#a18f80;
    font-size:14px;
}

.footer{
    margin-top:auto;
    padding-top:70px;

    letter-spacing:7px;
    font-size:12px;
    color:#b9aa9c;
}


/* =========================
   TOP BAR
========================= */

.topbar{
    position:sticky;
    top:0;
    z-index:30;

    background:rgba(246,240,232,.94);
    backdrop-filter:blur(12px);

    border-bottom:1px solid #e3d7ca;

    padding:14px 18px;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.top-brand{
    font-size:25px;
    font-weight:900;
}

.back{
    border:0;
    background:#eadfd3;

    width:42px;
    height:42px;

    border-radius:50%;

    font-size:22px;
}

.cart-button{
    border:0;
    background:#4b2d20;
    color:white;

    border-radius:25px;

    padding:11px 17px;

    font-weight:800;
}

.cart-count{
    background:#d9b783;
    color:#302720;

    padding:2px 7px;

    border-radius:20px;

    margin-right:4px;
}


/* =========================
   MENU
========================= */

.menu-page{
    padding-bottom:110px;
}

.menu-wrap{
    width:min(1000px,100%);
    margin:auto;
    padding:25px 18px;
}

.menu-title{
    margin:5px 0 20px;
}

.menu-title h1{
    font-size:34px;
    margin:0;
}

.menu-title p{
    margin:7px 0;
    color:#9c8b7d;
}

.categories{
    display:flex;
    gap:9px;

    overflow-x:auto;

    padding-bottom:12px;

    scrollbar-width:none;
}

.categories::-webkit-scrollbar{
    display:none;
}

.category{
    border:1px solid #dfd1c3;
    background:#fffaf5;
    color:#554237;

    padding:11px 18px;

    border-radius:30px;

    white-space:nowrap;

    font-weight:700;
}

.category.active{
    background:#4b2d20;
    color:white;

    border-color:#4b2d20;
}

.products{
    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:16px;

    margin-top:20px;
}

.product{
    background:#fffaf5;

    border:1px solid #e5d9cc;

    border-radius:25px;

    overflow:hidden;

    box-shadow:0 10px 25px rgba(60,40,25,.06);
}

.product-image{
    height:180px;

    background:
        radial-gradient(circle at 30% 30%,#d7c0a7 0 12%,transparent 13%),
        radial-gradient(circle at 70% 70%,#9e775b 0 20%,transparent 21%),
        linear-gradient(135deg,#eee1d2,#c9b09a);

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:65px;
}

.product-body{
    padding:15px;
}

.product-name{
    font-size:20px;
    font-weight:900;
    margin-bottom:5px;
}

.product-desc{
    font-size:12px;
    color:#a08d7d;
    min-height:30px;
}

.product-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:8px;

    margin-top:15px;
}

.price{
    font-weight:900;
}

.add{
    border:0;

    background:#4b2d20;
    color:white;

    padding:10px 15px;

    border-radius:14px;

    font-weight:800;
}


/* =========================
   CART
========================= */

.panel{
    position:fixed;
    inset:0;

    z-index:100;

    background:rgba(30,20,15,.45);

    display:none;

    align-items:flex-end;
    justify-content:center;
}

.panel.open{
    display:flex;
}

.panel-box{
    background:#f8f1e8;

    width:min(650px,100%);

    max-height:90vh;

    overflow:auto;

    border-radius:30px 30px 0 0;

    padding:22px;

    animation:slideUp .25s ease;
}

@keyframes slideUp{

    from{
        transform:translateY(100%);
    }

    to{
        transform:translateY(0);
    }

}

.panel-head{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:20px;
}

.panel-head h2{
    margin:0;
    font-size:28px;
}

.close{
    border:0;

    background:#e9ded2;

    width:42px;
    height:42px;

    border-radius:50%;

    font-size:22px;
}

.cart-items{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.cart-item{
    background:#fffaf5;

    border:1px solid #e2d6ca;

    border-radius:18px;

    padding:14px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:10px;
}

.cart-info{
    flex:1;
}

.cart-name{
    font-weight:900;
}

.cart-price{
    font-size:12px;
    color:#998677;

    margin-top:4px;
}

.qty{
    display:flex;
    align-items:center;
    gap:7px;
}

.qty button{
    border:0;

    background:#e8ddd1;

    width:31px;
    height:31px;

    border-radius:10px;

    font-weight:900;
}

.total{
    display:flex;
    justify-content:space-between;

    padding:20px 0;

    font-size:20px;

    font-weight:900;
}

.primary{
    width:100%;

    border:0;

    background:#4b2d20;
    color:white;

    padding:16px;

    border-radius:17px;

    font-size:17px;

    font-weight:900;
}

.empty-cart{
    text-align:center;

    padding:45px 10px;

    color:#9c8b7d;
}


/* =========================
   ORDER FORM
========================= */

.form-page{
    padding-bottom:50px;
}

.form-wrap{
    width:min(650px,100%);

    margin:auto;

    padding:25px 18px;
}

.form-title{
    font-size:32px;

    font-weight:900;

    margin-bottom:30px;
}

.field{
    margin-bottom:20px;
}

.field label{
    display:block;

    font-weight:900;

    font-size:18px;

    margin-bottom:9px;
}

.field input,
.field textarea{
    width:100%;

    border:1px solid #ddcfc1;

    background:#fffaf5;

    border-radius:18px;

    padding:17px;

    font-size:17px;

    outline:none;

    color:#302720;
}

.field textarea{
    height:125px;

    resize:vertical;
}

.field input:focus,
.field textarea:focus{
    border-color:#a78464;
}

.required{
    color:#a34c3d;
}

.submit{
    margin-top:10px;
}

.error{
    background:#f3d8d3;

    color:#783d35;

    padding:14px;

    border-radius:15px;

    margin-top:12px;
}


/* =========================
   CONFIRMATION
========================= */

.confirm-page{
    min-height:100vh;

    padding:30px 18px;

    align-items:center;

    justify-content:center;
}

.confirm-box{
    width:min(650px,100%);

    background:#fffaf5;

    border:1px solid #e0d4c8;

    border-radius:32px;

    padding:35px 25px;

    text-align:center;

    box-shadow:0 20px 50px rgba(60,40,25,.1);
}

.check{
    width:78px;
    height:78px;

    border-radius:50%;

    background:#315d39;

    color:#c9e3cc;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:42px;

    margin:0 auto 20px;
}

.eyebrow{
    letter-spacing:4px;

    font-size:11px;

    font-weight:900;

    color:#b18a54;
}

.confirm-box h1{
    font-size:34px;

    margin:10px 0;
}

.confirm-box p{
    color:#998779;
}

.order-number{
    font-size:35px;

    font-weight:900;

    margin:25px 0;
}

.info-card{
    text-align:right;

    background:#f4ebe1;

    border-radius:20px;

    padding:16px;

    margin:15px 0 22px;
}

.info-row{
    display:flex;

    justify-content:space-between;

    gap:15px;

    padding:8px 0;
}

.info-row span:first-child{
    color:#9a8879;
}

.secondary{
    width:100%;

    border:1px solid #d9cbbd;

    background:#fffaf5;

    color:#302720;

    padding:15px;

    border-radius:16px;

    font-weight:900;

    margin-top:10px;
}


/* =========================
   TRACKING
========================= */

.track-page{
    min-height:100vh;

    padding:25px 18px 50px;
}

.track-wrap{
    width:min(650px,100%);

    margin:auto;
}

.track-title{
    font-size:32px;

    font-weight:900;

    margin-bottom:25px;
}

.track-form{
    background:#fffaf5;

    border:1px solid #e0d4c8;

    border-radius:24px;

    padding:20px;
}

.track-form input{
    width:100%;

    padding:16px;

    border:1px solid #ddd0c3;

    border-radius:15px;

    background:#f8f1e8;

    font-size:17px;

    margin-bottom:10px;
}

.steps{
    margin-top:25px;

    background:#fffaf5;

    border:1px solid #e0d4c8;

    border-radius:25px;

    padding:25px;
}

.step{
    display:flex;

    align-items:center;

    gap:15px;

    padding:15px 0;

    position:relative;
}

.step:not(:last-child):after{
    content:"";

    position:absolute;

    right:18px;

    top:50px;

    height:30px;

    border-right:2px dashed #d8c9ba;
}

.step-dot{
    width:38px;
    height:38px;

    border-radius:50%;

    background:#e7dcd0;

    display:flex;

    align-items:center;

    justify-content:center;

    font-weight:900;

    z-index:2;
}

.step.active .step-dot{
    background:#4b2d20;

    color:white;
}

.step.done .step-dot{
    background:#315d39;

    color:white;
}

.step-text{
    font-weight:900;
}

.track-result{
    margin-top:20px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:650px){

    .brand-name{
        font-size:65px;
    }

    .products{
        grid-template-columns:1fr;
    }

    .product-image{
        height:210px;
    }

    .mode-text h2{
        font-size:23px;
    }

}

</style>
</head>

/* =========================
   PAGE SYSTEM
========================= */

function showPage(id){

    /*
       أول شيء نخفي كل الصفحات بالقوة.
       هذا يمنع ظهور صفحة البيانات
       مع صفحة التأكيد في نفس الوقت.
    */

    document
        .querySelectorAll(".page")
        .forEach(page => {

            page.classList.remove("active");

            page.style.display = "none";

        });


    const target =
        document.getElementById(id);


    if(!target){
        return;
    }


    target.classList.add("active");


    /*
       صفحة التأكيد تحتاج flex
       حتى تكون في المنتصف.
    */

    if(id === "confirmPage"){

        target.style.display = "flex";

    }else{

        target.style.display = "block";

    }


    window.scrollTo(0,0);

}


function goHome(){

    /*
       تنظيف رسالة الخطأ القديمة
    */

    document.getElementById("formError").innerHTML = "";

    document.getElementById("trackError").innerHTML = "";

    showPage("homePage");

}


/* =========================
   AUTH
========================= */

async function ensureAuth(){

    const {
        data:{
            session
        }
    } = await sb.auth.getSession();


    if(session){
        return session;
    }


    const {
        data,
        error
    } =
    await sb.auth.signInAnonymously();


    if(error){
        throw error;
    }


    return data.session;

}


/* =========================

========================= */

function startOrder(mode){

    orderMode = mode;

    cart = [];

    currentCategory = "all";

            "hidden",
            mode !== "cafe"

    document

/* =========================

========================= */

function renderCategories(){

    const container =
        document.getElementById("categories");


    container.innerHTML =
        categories
        .map(category => `

            <button
                class="category ${
                    currentCategory === category.id
                    ? "active"
                    : ""
                }"
                onclick="selectCategory('${category.id}')"
            >

                ${
                    english
                    ? category.en
                    : category.ar
                }

            </button>

        `)
        .join("");

}


function selectCategory(category){

    currentCategory = category;

    renderCategories();

    renderProducts();

}


function renderProducts(){

    const container =
        document.getElementById("products");


    const filtered =
        currentCategory === "all"
        ? products
        : products.filter(
            product =>
            product.category === currentCategory
        );


    container.innerHTML =
        filtered
        .map(product => `

            <div class="product">

                <div class="product-image">

                    ${product.emoji}

                </div>


                <div class="product-body">

                    <div class="product-name">

                        ${
                            english
                            ? product.en
                            : product.name
                        }

                    </div>


                    <div class="product-desc">

                        ${product.description}

                    </div>


                    <div class="product-bottom">

                        <div class="price">

                            ${product.price.toFixed(3)}
                            ر.ع

                        </div>


                        <button
                            class="add"
                            onclick="addToCart(${product.id})"
                        >

                            ${
                                english

                                : "إضافة"
                            }

/* =========================
   CART
========================= */

function addToCart(id){

    const product =
        products.find(
            product => product.id === id
        );


    if(!product){
        return;
    }


    const existing =
        cart.find(
            item => item.id === id
        );


    if(existing){

        existing.qty++;

    }else{

        cart.push({
            ...product,
            qty:1
        });

    }


    updateCartCount();

}


function updateCartCount(){

    const count =
        cart.reduce(
            (sum,item) =>
            sum + item.qty,
            0
        );


    document.getElementById("cartCount")
        .textContent = count;

}


function openCart(){

    renderCart();

    document
        .getElementById("cartPanel")
        .classList.add("open");

}


function closeCart(){

    document
        .getElementById("cartPanel")
        .classList.remove("open");

}


function renderCart(){

    const container =
        document.getElementById("cartItems");


    if(cart.length === 0){

        container.innerHTML = `

            <div class="empty-cart">

                السلة فارغة ☕

            </div>

        `;


        document.getElementById("cartTotal")
            .textContent =
            "0.000 ر.ع";


        return;

    }


    container.innerHTML =
        cart
        .map(item => `

            <div class="cart-item">

                <div class="cart-info">

                    <div class="cart-name">

                        ${
                            english
                            ? item.en
                            : item.name
                        }

                    </div>


                    <div class="cart-price">

                        ${item.price.toFixed(3)}
                        ر.ع

                    </div>

                </div>


                <div class="qty">

                    <button
                        onclick="changeQty(${item.id},-1)"
                    >
                        −
                    </button>


                    <strong>
                        ${item.qty}
                    </strong>


                    <button
                        onclick="changeQty(${item.id},1)"
                    >
                        +
                    </button>

                </div>

            </div>

        `)
        .join("");


    document.getElementById("cartTotal")
        .textContent =
        calculateTotal().toFixed(3)
        + " ر.ع";

}


function changeQty(id,change){

    const item =
        cart.find(
            item => item.id === id
        );


    if(!item){
        return;
    }


    item.qty += change;


    if(item.qty <= 0){

        cart =
            cart.filter(
                item => item.id !== id
            );

    }


    updateCartCount();

    renderCart();

}


function calculateTotal(){

    return cart.reduce(
        (sum,item) =>
        sum + (item.price * item.qty),
        0
    );

}


function goToOrderForm(){

    if(cart.length === 0){

        alert(
            english
            ? "Your cart is empty."
            : "السلة فارغة."
        );

        return;

    }


    closeCart();

    document.getElementById("formError")
        .innerHTML = "";


    showPage("formPage");

}


/* =========================
   SUBMIT ORDER
========================= */

async function submitOrder(){

    const button =
        document.getElementById("submitButton");


    const errorBox =
        document.getElementById("formError");


    /*
       نمسح أي خطأ قديم.
    */

    errorBox.innerHTML = "";


    if(cart.length === 0){

        errorBox.innerHTML = `
            <div class="error">
                السلة فارغة
            </div>
        `;

        return;

    }


    const phone =
        document.getElementById("phone")
        .value
        .trim();


    const notes =
        document.getElementById("notes")
        .value
        .trim();


    const tableNumber =
        document.getElementById("tableNumber")
        .value
        .trim();


    const vehicle =
        document.getElementById("vehicleDescription")
        .value
        .trim();


    if(!phone){

        errorBox.innerHTML = `
            <div class="error">
                أدخل رقم الهاتف
            </div>
        `;

        return;

    }


    if(
        orderMode === "cafe"
        &&
        !tableNumber
    ){

        errorBox.innerHTML = `
            <div class="error">
                أدخل رقم الطاولة
            </div>
        `;

        return;

    }


    if(
        orderMode === "car"
        &&
        !vehicle
    ){

        errorBox.innerHTML = `
            <div class="error">
                اكتب وصف السيارة
            </div>
        `;

        return;

    }


    button.disabled = true;

    button.textContent =
        "جاري إرسال الطلب...";


    try{

        /*
           إنشاء جلسة العميل
        */

        const session =
            await ensureAuth();


        /*
           رقم طلب جديد
        */

        const orderNumber =
            generateOrderNumber();


        /*
           تجهيز المنتجات
        */

        const orderItems =
            cart.map(item => ({

                id:item.id,

                name:item.name,

                name_en:item.en,

                qty:item.qty,

                price:item.price

            }));


        /*
           بيانات الطلب
        */

        const payload = {

            order_number:orderNumber,

            order_type:orderMode,

            table_number:
                orderMode === "cafe"
                ? tableNumber
                : null,

            vehicle_description:
                orderMode === "car"
                ? vehicle
                : null,

            phone:phone,

            notes:notes,

            items:orderItems,

            total:Number(
                calculateTotal()
                .toFixed(3)
            ),

            status:"received",

            user_id:session.user.id

        };


        /*
           إرسال الطلب إلى Supabase
        */

        const {
            data,
            error
        } =
        await sb
        .from("orders")
        .insert(payload)
        .select()
        .single();


        if(error){

            /*
               نرمي الخطأ الحقيقي
               بدل الانتقال لصفحة التأكيد.
            */

            console.error(
                "SUPABASE ERROR:",
                error
            );

            throw error;

        }


        /*
           فقط إذا نجح الحفظ فعلًا
           ننتقل إلى التأكيد.
        */

        currentOrder = data;


        /*
           نمسح الخطأ
        */

        errorBox.innerHTML = "";


        /*
           نمسح السلة
        */

        cart = [];

        updateCartCount();


        /*
           عرض صفحة التأكيد فقط
        */

        showConfirmation(data);


    }catch(error){

        console.error(
            "ORDER ERROR:",
            error
        );


        /*
           نبقى في صفحة بيانات الطلب.
           لا نعرض صفحة التأكيد.
        */

        showPage("formPage");


        errorBox.innerHTML = `

            <div class="error">

                حدث خطأ أثناء إرسال الطلب.
                تأكد من اتصال الإنترنت وحاول مرة أخرى.

            </div>

        `;


        button.disabled = false;

        button.textContent =
            "تأكيد الطلب ✓";

    }

}


/* =========================
   ORDER NUMBER
========================= */

function generateOrderNumber(){

    const random =
        Math.floor(
            10000 +
            Math.random() * 90000
        );


    return "B" + random;

}


/* =========================
   CONFIRMATION
========================= */

function showConfirmation(order){

    /*
       تنظيف أي أخطاء قديمة
    */

    document.getElementById("formError")
        .innerHTML = "";


    /*
       رقم الطلب
    */

    document.getElementById(
        "confirmedNumber"
    )
    .textContent =
        "#" + order.order_number;


    /*
       طريقة الاستلام
    */

    document.getElementById(
        "confirmedLocation"
    )
    .textContent =

        order.order_type === "cafe"

        ? "طاولة " + order.table_number

        : order.vehicle_description;


    /*
       الهاتف
    */

    document.getElementById(
        "confirmedPhone"
    )
    .textContent =
        order.phone;


    /*
       الملاحظة
    */

    document.getElementById(
        "confirmedNotes"
    )
    .textContent =
        order.notes || "لا توجد";


    /*
       الانتقال للتأكيد
       ويختفي نموذج الطلب بالكامل.
    */

    showPage("confirmPage");

}


/* =========================
   TRACKING
========================= */

function openTracking(){

    if(currentOrder){

        document.getElementById(
            "trackNumber"
        )
        .value =
            currentOrder.order_number;


        document.getElementById(
            "trackPhone"
        )
        .value =
            currentOrder.phone;


        trackOrder();

    }else{

        showPage("trackPage");

    }

}


async function trackOrder(){

    const number =
        document.getElementById(
            "trackNumber"
        )
        .value
        .trim()
        .toUpperCase();


    const phone =
        document.getElementById(
            "trackPhone"
        )
        .value
        .trim();


    const errorBox =
        document.getElementById(
            "trackError"
        );


    errorBox.innerHTML = "";


    if(!number || !phone){

        errorBox.innerHTML = `
            <div class="error">
                أدخل رقم الطلب ورقم الهاتف
            </div>
        `;

        return;

    }


    try{

        const session =
            await ensureAuth();


        const {
            data,
            error
        } =
        await sb
        .from("orders")
        .select("*")
        .eq(
            "order_number",
            number
        )
        .eq(
            "phone",
            phone
        )
        .eq(
            "user_id",
            session.user.id
        )
        .single();


        if(error || !data){

            throw new Error(
                "Order not found"
            );

        }


        currentOrder = data;


        renderTracking(data);


    }catch(error){

        console.error(
            "TRACK ERROR:",
            error
        );


        document
        .getElementById("trackResult")
        .classList
        .add("hidden");


        errorBox.innerHTML = `

            <div class="error">

                لم يتم العثور على الطلب.
                تأكد من رقم الطلب ورقم الهاتف.

            </div>

        `;

    }

}


function renderTracking(order){

    const statuses = [

        "received",

        "preparing",

        "ready",

        "delivered"

    ];


    const currentIndex =
        statuses.indexOf(
            order.status
        );


    document
    .querySelectorAll(".step")
    .forEach(
        (step,index) => {

            step.classList.remove(
                "active",
                "done"
            );


            if(index < currentIndex){

                step.classList.add(
                    "done"
                );

            }


            if(index === currentIndex){

                step.classList.add(
                    "active"
                );

            }

        }
    );


    document
    .getElementById("trackResult")
    .classList
    .remove("hidden");


    showPage("trackPage");

}


/* =========================
   REALTIME
========================= */

let realtimeChannel = null;


async function listenToCurrentOrder(){

    if(!currentOrder){
        return;
    }


    if(realtimeChannel){

        await sb.removeChannel(
            realtimeChannel
        );

    }


    realtimeChannel =
        sb
        .channel(
            "order-" +
            currentOrder.id
        )
        .on(
            "postgres_changes",
            {
                event:"UPDATE",
                schema:"public",
                table:"orders",
                filter:
                    "id=eq." +
                    currentOrder.id
            },
            payload => {

                currentOrder =
                    payload.new;


                renderTracking(
                    payload.new
                );

            }
        )
        .subscribe();

}


/* =========================
   INIT
========================= */

async function init(){

    try{

        await ensureAuth();

    }catch(error){

        console.error(
            "AUTH ERROR:",
            error
        );

    }


    renderCategories();

    renderProducts();

}


init();
