<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>برني كافيه</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #f5efe7;
      color: #2d2723;
      font-family: "Cairo", sans-serif;
      overflow: hidden;
    }

    /* =========================
       شاشة البداية
    ========================= */

    .splash {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #f5efe7;
      display: flex;
      align-items: center;
      justify-content: center;

      animation: splashFade 1.8s ease forwards;
      animation-delay: 1.4s;
    }

    .logo {
      font-size: clamp(64px, 14vw, 120px);
      font-weight: 800;
      letter-spacing: -4px;
      color: #302720;

      opacity: 0;
      transform: translateY(12px) scale(.97);

      animation:
        logoAppear 1.2s cubic-bezier(.22, 1, .36, 1) forwards,
        logoFade 1.2s ease forwards;

      animation-delay:
        .15s,
        1.15s;
    }

    /* =========================
       الصفحة الرئيسية
    ========================= */

    .home {
      min-height: 100vh;
      padding: 35px 22px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      opacity: 0;
      transform: translateY(12px);

      animation: homeAppear 1s ease forwards;
      animation-delay: 2.25s;
    }

    .brand {
      text-align: center;
      margin-bottom: 55px;
    }

    .brand-name {
      margin: 0;
      font-size: clamp(54px, 12vw, 86px);
      line-height: 1;
      font-weight: 800;
      letter-spacing: -3px;
    }

    .brand-subtitle {
      margin-top: 14px;
      color: #9c8d80;
      font-size: 14px;
      font-weight: 500;
    }

    .options {
      width: min(520px, 100%);
      display: grid;
      gap: 16px;
    }

    .option {
      width: 100%;
      min-height: 105px;

      border: 1px solid #e4d9cd;
      border-radius: 24px;

      background: rgba(255, 251, 246, .78);

      display: flex;
      align-items: center;
      gap: 18px;

      padding: 20px 22px;

      font-family: inherit;
      text-align: right;
      color: #302820;

      cursor: pointer;

      box-shadow: 0 12px 30px rgba(75, 58, 44, .06);

      transition:
        transform .25s ease,
        box-shadow .25s ease,
        background .25s ease;
    }

    .option:hover {
      transform: translateY(-3px);
      background: #fffaf5;
      box-shadow: 0 18px 35px rgba(75, 58, 44, .10);
    }

    .option:active {
      transform: scale(.98);
    }

    .icon {
      width: 58px;
      height: 58px;
      flex: 0 0 58px;

      border-radius: 18px;

      background: #eee4d9;

      display: grid;
      place-items: center;

      font-size: 27px;
    }

    .option-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .option-title {
      font-size: 19px;
      font-weight: 800;
    }

    .option-description {
      color: #9c8d80;
      font-size: 12px;
      font-weight: 500;
    }

    .footer {
      position: fixed;
      bottom: 18px;
      left: 0;
      right: 0;

      text-align: center;

      color: #b2a398;
      font-size: 10px;
      letter-spacing: 1px;
    }

    /* =========================
       الحركات
    ========================= */

    @keyframes logoAppear {
      from {
        opacity: 0;
        transform: translateY(12px) scale(.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes logoFade {
      from {
        opacity: 1;
        transform: scale(1);
      }

      to {
        opacity: 0;
        transform: scale(1.02);
      }
    }

    @keyframes splashFade {
      from {
        opacity: 1;
        visibility: visible;
      }

      to {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
    }

    @keyframes homeAppear {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================
       الجوال
    ========================= */

    @media (max-width: 560px) {

      .home {
        padding: 25px 18px;
      }

      .brand {
        margin-bottom: 42px;
      }

      .brand-name {
        font-size: 58px;
      }

      .option {
        min-height: 96px;
        border-radius: 21px;
        padding: 18px;
      }

      .icon {
        width: 54px;
        height: 54px;
        flex-basis: 54px;
      }

      .option-title {
        font-size: 17px;
      }

      .option-description {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>

  <!-- شاشة الشعار -->
  <div class="splash">
    <div class="logo">برني</div>
  </div>


  <!-- الصفحة الرئيسية -->
  <main class="home">

    <div class="brand">
      <h1 class="brand-name">برني</h1>
      <div class="brand-subtitle">
      </div>
    </div>


    <div class="options">

      <!-- داخل المقهى -->
      <button class="option" type="button">

        <div class="icon">☕</div>

        <div class="option-text">
          <span class="option-title">
            داخل المقهى
          </span>

          <span class="option-description">
            اطلب واستمتع بجلستك
          </span>
        </div>

      </button>


      <!-- من السيارة -->
      <button class="option" type="button">

        <div class="icon">🚗</div>

        <div class="option-text">
          <span class="option-title">
            من السيارة
          </span>

          <span class="option-description">
            اطلب واستلم طلبك من السيارة
          </span>
        </div>

      </button>

    </div>

  </main>


  <div class="footer">
    B A R N I &nbsp; C A F E
  </div>

</body>
</html>
