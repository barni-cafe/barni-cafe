<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barni Cafe | برني كافيه</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="brand">برني كافيه</div>
    <p>قهوة تجمعنا ☕</p>
  </header>

  <main>
    <section class="menu-section">
      <h1>المنيو</h1>

      <div id="categories" class="categories"></div>

      <div id="menu" class="menu-grid"></div>
    </section>

    <aside class="cart">
      <div class="cart-title">
        <h2>السلة</h2>
        <span id="cartCount">0</span>
      </div>
      <div id="cartItems" class="cart-items">
        <p class="empty">السلة فاضية ☕</p>
      </div>
      <div class="cart-total">
        <span>الإجمالي</span>
        <strong id="cartTotal">0.000 ر.ع</strong>
      </div>
      <button id="clearCart" class="clear-btn">مسح السلة</button>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
