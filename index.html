<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>برني كافيه</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

html,body{
margin:0;
min-height:100%;
background:#f5efe7;
color:#302720;
font-family:"Cairo",sans-serif
}

button,input,textarea{font-family:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* =========================
   شاشة البداية
========================= */

.splash{
position:fixed;
inset:0;
z-index:999;
background:#f5efe7;
display:flex;
align-items:center;
justify-content:center;
animation:splashOut 1.2s ease 1.8s forwards;
pointer-events:none
}

.splash-logo{
font-size:clamp(70px,15vw,120px);
font-weight:800;
letter-spacing:-5px;
opacity:0;
animation:logoIn 1.2s cubic-bezier(.22,1,.36,1) forwards
}

@keyframes logoIn{
from{
opacity:0;
transform:translateY(12px) scale(.96)
}
to{
opacity:1;
transform:translateY(0) scale(1)
}
}

@keyframes splashOut{
to{
opacity:0;
visibility:hidden
}
}

/* =========================
   الصفحة الرئيسية
========================= */

.home{
min-height:100vh;
padding:30px 18px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center
}

.brand{
text-align:center;
margin-bottom:48px
}

.brand h1{
margin:0;
font-size:clamp(60px,12vw,88px);
line-height:1;
font-weight:800;
letter-spacing:-4px
}

.options{
width:min(520px,100%);
display:grid;
gap:15px
}

.option{
border:1px solid #e3d8cc;
background:#fffaf5;
border-radius:24px;
padding:20px;
display:flex;
align-items:center;
gap:17px;
text-align:right;
color:#302720;
box-shadow:0 10px 28px #4d392414;
transition:.25s
}

.option:hover{
transform:translateY(-3px)
}

.icon{
width:58px;
height:58px;
flex:0 0 58px;
border-radius:18px;
background:#eee3d7;
display:grid;
place-items:center;
font-size:28px
}

.option strong{
display:block;
font-size:19px
}

.option small{
color:#9a897b;
font-size:11px
}

/* =========================
   المنيو
========================= */

.app{
max-width:760px;
margin:auto;
padding-bottom:110px
}

.top{
height:70px;
padding:0 16px;
display:flex;
align-items:center;
justify-content:space-between;
position:sticky;
top:0;
z-index:20;
background:#f5efe7dd;
backdrop-filter:blur(12px)
}

.logo-small{
font-size:30px;
font-weight:800
}

.lang{
border:1px solid #daccc0;
background:#fffaf5;
border-radius:12px;
padding:8px 14px;
font-weight:800
}

.hero{
margin:8px 16px 18px;
background:#fffaf5;
border-radius:28px;
padding:24px;
text-align:center;
box-shadow:0 10px 30px #4d392410
}

.hero h2{
margin:0;
font-size:28px
}

.hero p{
margin:6px 0 0;
color:#9b8a7b;
font-size:12px
}

.categories{
display:flex;
gap:8px;
overflow:auto;
padding:0 16px 18px;
scrollbar-width:none
}

.categories::-webkit-scrollbar{
display:none
}

.cat{
white-space:nowrap;
border:1px solid #dfd2c5;
background:#fffaf5;
border-radius:18px;
padding:9px 15px;
font-size:11px
}

.cat.active{
background:#4a2b1d;
color:#fff;
border-color:#4a2b1d
}

/* =========================
   المنتجات
========================= */

.products{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
padding:0 16px
}

.product{
background:#fffaf5;
border-radius:20px;
overflow:hidden;
box-shadow:0 6px 20px #4d392410
}

.product-img{
height:155px;
display:grid;
place-items:center;
font-size:72px;
background:linear-gradient(135deg,#eaded1,#d5c2af)
}

.info{
padding:12px
}

.name{
font-size:14px;
font-weight:800
}

.desc{
font-size:9px;
color:#9a897b;
min-height:28px;
margin-top:3px
}

.bottom{
display:flex;
align-items:center;
justify-content:space-between;
margin-top:10px
}

.price{
font-weight:800;
font-size:13px
}

.add{
width:34px;
height:34px;
border:0;
border-radius:50%;
background:#4a2b1d;
color:#fff;
font-size:20px
}

/* =========================
   السلة
========================= */

.cart{
position:fixed;
bottom:15px;
left:50%;
transform:translateX(-50%);
width:min(500px,calc(100% - 25px));
background:#4a2b1d;
color:#fff;
border-radius:20px;
padding:10px 12px;
display:flex;
align-items:center;
gap:12px;
z-index:50;
box-shadow:0 12px 35px #0003
}

.cart-info{
flex:1
}

.cart-info small{
display:block;
color:#d9c9bd;
font-size:9px
}

.cart-total{
font-weight:800
}

.cart button{
border:0;
background:#fffaf5;
color:#4a2b1d;
border-radius:12px;
padding:11px 15px;
font-weight:800
}

/* =========================
   نافذة السلة
========================= */

.overlay{
position:fixed;
inset:0;
background:#0006;
z-index:80
}

.sheet{
position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);
width:min(600px,100%);
max-height:85vh;
overflow:auto;
background:#f5efe7;
border-radius:28px 28px 0 0;
padding:22px;
z-index:81
}

.sheet-head{
display:flex;
justify-content:space-between;
align-items:center
}

.close{
border:0;
background:#e9ded3;
border-radius:50%;
width:38px;
height:38px;
font-size:20px
}

.cart-item{
background:#fffaf5;
border-radius:16px;
padding:12px;
margin:10px 0;
display:flex;
align-items:center;
gap:10px
}

.cart-item .emoji{
font-size:35px
}

.cart-item-info{
flex:1
}

.qty{
display:flex;
align-items:center;
gap:8px
}

.qty button{
width:28px;
height:28px;
border:0;
border-radius:50%;
background:#4a2b1d;
color:#fff
}

.checkout{
width:100%;
border:0;
background:#4a2b1d;
color:#fff;
padding:15px;
border-radius:15px;
font-weight:800;
margin-top:10px
}

/* =========================
   بيانات الطلب
========================= */

.fullscreen{
position:fixed;
inset:0;
z-index:200;
background:#f5efe7;
overflow:auto
}

.order-form{
width:min(520px,100%);
min-height:100vh;
margin:auto;
padding:28px 20px
}

.order-head{
display:flex;
align-items:center;
gap:15px;
margin-bottom:30px
}

.order-head h2{
margin:0
}

.order-head button{
width:40px;
height:40px;
border:0;
border-radius:50%;
background:#e9ded3;
font-size:22px
}

.order-form label{
display:block;
font-weight:700;
margin-bottom:18px
}

.order-form input,
.order-form textarea{
width:100%;
margin-top:7px;
padding:14px;
border:1px solid #dfd2c6;
border-radius:14px;
background:#fffaf5;
font:inherit;
outline:none
}

.order-form textarea{
min-height:110px;
resize:none
}

.confirm-order,
.track-order{
width:100%;
border:0;
border-radius:15px;
padding:15px;
background:#4a2b1d;
color:#fff;
font-weight:800;
font-size:15px
}

/* =========================
   تأكيد الطلب
========================= */

.confirmation-card{
width:min(500px,calc(100% - 30px));
margin:60px auto;
padding:30px 22px;
background:#fffaf5;
border-radius:28px;
text-align:center;
box-shadow:0 15px 40px #4d392418
}

.success-check{
width:65px;
height:65px;
margin:auto;
border-radius:50%;
display:grid;
place-items:center;
background:#e5f2e5;
color:#4c9656;
font-size:35px;
font-weight:800
}

.success-label{
margin-top:15px;
color:#4c9656;
font-weight:800
}

.order-number,
.tracking-number{
display:inline-block;
margin:15px 0;
padding:12px 22px;
border-radius:14px;
background:#eee3d7;
font-size:22px;
font-weight:800
}

.order-details{
text-align:right;
margin:10px 0 22px
}

.order-details p{
display:flex;
justify-content:space-between;
gap:15px;
padding:10px 0;
border-bottom:1px solid #eadfd5;
font-size:12px
}

/* =========================
   تتبع الطلب
========================= */

.tracking-logo{
font-size:48px;
font-weight:800
}

.steps{
margin-top:30px;
text-align:right
}

.step{
display:flex;
align-items:center;
gap:14px;
padding:14px 0;
color:#aaa
}

.step div{
width:38px;
height:38px;
border-radius:50%;
background:#e8ded4;
display:grid;
place-items:center;
font-weight:800
}

.step.active,
.step.done{
color:#4c9656;
font-weight:800
}

.step.active div,
.step.done div{
background:#4c9656;
color:#fff
}

.step.current{
color:#4a2b1d;
font-weight:800
}

.step.current div{
background:#4a2b1d;
color:#fff
}

/* =========================
   الجوال
========================= */

@media(max-width:560px){

.products{
grid-template-columns:1fr 1fr
}

.product-img{
height:130px;
font-size:58px
}

.brand h1{
font-size:62px
}

.hero h2{
font-size:24px
}

}
</style>
</head>

<!-- =========================

<!-- =========================

<div class="cart hidden" id="cartBar">

أصناف

<div id="cartItems">

<div

<span id="totalText">
المجموع
</span>

<span id="sheetTotal">
0.000 ر.ع
</span>

</div>


<button
class="checkout"
onclick="checkout()"
id="checkoutBtn">

إتمام الطلب

</button>

</div>


<!-- =========================
     بيانات الطلب
========================= -->

<div
class="fullscreen hidden"
id="orderFormScreen">
</div>


<!-- =========================
     تأكيد الطلب + التتبع
========================= -->

<div
class="fullscreen hidden"
id="confirmationScreen">
</div>


<script>

/* =========================

========================= */

let language="ar";

let mode="cafe";

let currentCategory="hot";

let cart=[];

/* =========================

}

/* =========================
   فتح المنيو
========================= */

function openMenu(selectedMode){

mode=selectedMode;

document
.getElementById("home")
.classList.add("hidden");

document
.getElementById("app")
.classList.remove("hidden");

renderCategories();

renderProducts();

}


/* =========================
   التصنيفات
========================= */

function renderCategories(){

const list=
language==="ar"
?categories.ar
:categories.en;

document.getElementById("categories").innerHTML=

list.map(c=>`

<button
class="cat ${c[0]===currentCategory?"active":""}"
onclick="selectCategory('${c[0]}')">

${c[1]} ${c[2]}

</button>

`).join("");

}


function selectCategory(cat){

currentCategory=cat;

renderCategories();

renderProducts();

}


/* =========================
   المنتجات
========================= */

function renderProducts(){

const items=
products.filter(
p=>p.cat===currentCategory
);

document.getElementById("products").innerHTML=

items.map(p=>`

<article class="product">

<div class="product-img">
${p.emoji}
</div>

<div class="info">

<div class="name">
${language==="ar"?p.ar:p.en}
</div>

<div class="desc">
${language==="ar"?p.descAr:p.descEn}
</div>

<div class="bottom">

<span class="price">

${p.price.toFixed(3)}

${language==="ar"?"ر.ع":"OMR"}

</span>

<button
class="add"
onclick="addToCart(${p.id})">

+

</button>

</div>

</div>

</article>

`).join("");

}


/* =========================
   إضافة للسلة
========================= */

function addToCart(id){

const item=
cart.find(i=>i.id===id);

if(item){

item.qty++;

}else{

cart.push({
id:id,
qty:1
});

}

updateCart();

}


/* =========================
   تحديث السلة
========================= */

function updateCart(){

const count=
cart.reduce(
(a,b)=>a+b.qty,
0
);

const total=
cart.reduce(

(sum,item)=>{

const product=
products.find(
p=>p.id===item.id
);

return sum+
product.price*
item.qty;

},

0

);


document.getElementById(
"cartCount"
).textContent=count;


document.getElementById(
"cartTotal"
).textContent=

total.toFixed(3)
+
" "
+
(language==="ar"?"ر.ع":"OMR");


document.getElementById(
"sheetTotal"
).textContent=

total.toFixed(3)
+
" "
+
(language==="ar"?"ر.ع":"OMR");


document.getElementById(
"cartBar"
).classList.toggle(
"hidden",
count===0
);


renderCartItems();

}


/* =========================
   عناصر السلة
========================= */

function renderCartItems(){

const box=
document.getElementById(
"cartItems"
);

if(!cart.length){

box.innerHTML=`

<p style="text-align:center;color:#9a897b">

${language==="ar"
?"السلة فارغة"
:"Your cart is empty"}

</p>

`;

return;

}


box.innerHTML=

cart.map(item=>{

const p=
products.find(
x=>x.id===item.id
);

return `

<div class="cart-item">

<div class="emoji">
${p.emoji}
</div>

<div class="cart-item-info">

<strong>
${language==="ar"?p.ar:p.en}
</strong>

<div>

${(
p.price*
item.qty
).toFixed(3)}

${language==="ar"?"ر.ع":"OMR"}

</div>

</div>


<div class="qty">

<button
onclick="changeQty(${p.id},-1)">
−
</button>

<span>
${item.qty}
</span>

<button
onclick="changeQty(${p.id},1)">
+
</button>

</div>

</div>

`;

}).join("");

}


/* =========================
   تغيير الكمية
========================= */

function changeQty(id,amount){

const item=
cart.find(
x=>x.id===id
);

if(!item)return;

item.qty+=amount;

if(item.qty<=0){

cart=
cart.filter(
x=>x.id!==id
);

}

updateCart();

}

function confirmOrder(){

const table=
document.getElementById(
"orderTable"
);

const car=
document.getElementById(
"orderCar"
);

const phone=
document.getElementById(
"orderPhone"
);

const note=
document.getElementById(
"orderNote"
);


if(
mode==="cafe"
&&
!table.value
){

language==="ar"
?
"اكتب رقم الطاولة أولًا"
:
"Enter the table number"
);

return;

}


if(
mode==="car"
&&
!car.value.trim()
){

alert(
language==="ar"
?
"اكتب رقم السيارة أولًا"
:
"Enter the vehicle number"
);

return;

}


if(!phone.value.trim()){

alert(
language==="ar"
?
"اكتب رقم الهاتف أولًا"
:
"Enter your phone number"
);

return;

}


order={

number:
"B"+
Math.floor(
10000+
Math.random()*90000
),

mode:mode,

table:
table
?
table.value
:
"",

car:
car
?
car.value
:
"",

phone:
phone.value,

note:
note.value,

status:
"received"

};


localStorage.setItem(
"barniOrder",
JSON.stringify(order)
);


cart=[];

updateCart();

closeOrderForm();

showConfirmation();

}

function showTracking(){

const statusList=[

"received",
"preparing",
"ready",
"delivered"

];


const current=
statusList.indexOf(
order.status
);


const labels=

language==="ar"

?

[
"تم استلام الطلب",
"جاري التحضير",
"جاهز",
"تم التسليم"
]

:

[
"Order Received",
"Preparing",
"Ready",
"Delivered"
];


document.getElementById(
"confirmationScreen"
).innerHTML=`

<div class="confirmation-card">

<div class="tracking-logo">
برني
</div>


<h2>

${language==="ar"
?"تتبع طلبك"
:"Track Your Order"}

</h2>


<div class="tracking-number">

#${order.number}

</div>


<div class="steps">


${labels.map(
(label,index)=>`

<div class="step

${
index<current
?
"done"
:
index===current
?
"current"
:
""
}

">

<div>

${
index<current
?
"✓"
:
index+1
}

</div>

<span>

${label}

</span>

</div>

`
).join("")}


</div>

</div>

`;

}
