<html lang="ar" dir="rtl">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    min-height:100%;
    background:#f5efe7;
    color:#302720;
    font-family:"Cairo",sans-serif;
}

body{
    overflow-x:hidden;
}

button,
input,
textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none !important;
}


/* =========================
   شاشة البداية
========================= */

.splash{
    position:fixed;
    inset:0;
    z-index:9999;
    background:#f5efe7;
    display:flex;
    align-items:center;
    justify-content:center;
    animation:splashHide 1.2s ease 1.8s forwards;
}

.splash-logo{
    font-size:110px;
    font-weight:800;
    letter-spacing:-7px;
    opacity:0;
    animation:logoShow 1.2s ease forwards;
}

@keyframes logoShow{

    0%{
        opacity:0;
        transform:scale(.9);
    }

    100%{
        opacity:1;
        transform:scale(1);
    }

}

@keyframes splashHide{

    100%{
        opacity:0;
        visibility:hidden;
    }

}


/* =========================
   الرئيسية
========================= */

.home{
    min-height:100vh;
    padding:30px 18px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.brand{
    text-align:center;
    margin-bottom:55px;
}

.brand h1{
    margin:0;
    font-size:90px;
    font-weight:800;
    letter-spacing:-6px;
}

.options{
    width:min(560px,100%);
    display:flex;
    flex-direction:column;
    gap:18px;
}

.option{
    width:100%;
    border:1px solid #e1d5c9;
    background:#fffaf5;
    border-radius:28px;
    padding:22px;
    display:flex;
    align-items:center;
    gap:18px;
    color:#302720;
    text-align:right;
    box-shadow:0 12px 30px rgba(70,45,25,.08);
    transition:.25s;
}

.option:hover{
    transform:translateY(-4px);
}

.icon{
    width:64px;
    height:64px;
    flex-shrink:0;
    border-radius:20px;
    background:#eee3d7;
    display:grid;
    place-items:center;
    font-size:31px;
}

.option strong{
    display:block;
    font-size:21px;
}

.option small{
    display:block;
    margin-top:4px;
    color:#9a897b;
    font-size:12px;
}


/* =========================
   التطبيق والمنيو
========================= */

.app{
    width:100%;
    max-width:800px;
    margin:auto;
    padding-bottom:120px;
}

.top{
    height:72px;
    padding:0 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:30;
    background:rgba(245,239,231,.9);
    backdrop-filter:blur(14px);
}

.logo-small{
    font-size:32px;
    font-weight:800;
}

.lang{
    border:1px solid #d9cabe;
    background:#fffaf5;
    color:#302720;
    border-radius:13px;
    padding:8px 16px;
    font-weight:800;
    font-size:14px;
}

.hero{
    margin:12px 18px 20px;
    padding:26px;
    border-radius:28px;
    background:#fffaf5;
    text-align:center;
    box-shadow:0 10px 30px rgba(70,45,25,.06);
}

.hero h2{
    margin:0;
    font-size:30px;
}

.hero p{
    margin:6px 0 0;
    color:#9a897b;
    font-size:13px;
}


/* =========================
   التصنيفات
========================= */

.categories{
    display:flex;
    gap:9px;
    padding:0 18px 20px;
    overflow-x:auto;
    scrollbar-width:none;
}

.categories::-webkit-scrollbar{
    display:none;
}

.cat{
    flex-shrink:0;
    border:1px solid #dfd2c5;
    background:#fffaf5;
    color:#302720;
    border-radius:20px;
    padding:10px 17px;
    font-size:12px;
}

.cat.active{
    background:#4a2b1d;
    border-color:#4a2b1d;
    color:white;
}


/* =========================
   المنتجات
========================= */

.products{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
    padding:0 18px;
}

.product{
    background:#fffaf5;
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 8px 25px rgba(70,45,25,.07);
}

.product-img{
    height:155px;
    display:grid;
    place-items:center;
    font-size:70px;
    background:linear-gradient(135deg,#eee2d6,#d8c3b1);
}

.info{
    padding:14px;
}

.name{
    font-size:15px;
    font-weight:800;
}

.desc{
    margin-top:3px;
    min-height:30px;
    color:#9a897b;
    font-size:10px;
}

.bottom{
    margin-top:11px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.price{
    font-size:13px;
    font-weight:800;
}

.add{
    width:36px;
    height:36px;
    border:0;
    border-radius:50%;
    background:#4a2b1d;
    color:white;
    font-size:22px;
}


/* =========================
   السلة السفلية
========================= */

.cart-bar{
    position:fixed;
    bottom:15px;
    left:50%;
    transform:translateX(-50%);
    width:min(520px,calc(100% - 26px));
    padding:11px 13px;
    border-radius:21px;
    background:#4a2b1d;
    color:white;
    display:flex;
    align-items:center;
    gap:12px;
    z-index:100;
    box-shadow:0 15px 35px rgba(0,0,0,.25);
}

.cart-info{
    flex:1;
}

.cart-info small{
    display:block;
    color:#d7c6b9;
    font-size:10px;
}

.cart-total{
    font-weight:800;
}

.cart-open{
    border:0;
    border-radius:13px;
    padding:12px 17px;
    background:#fffaf5;
    color:#4a2b1d;
    font-weight:800;
}


/* =========================
   السلة
========================= */

.overlay{
    position:fixed;
    inset:0;
    z-index:150;
    background:rgba(0,0,0,.55);
}

.cart-sheet{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:min(620px,100%);
    max-height:85vh;
    overflow-y:auto;
    padding:23px;
    border-radius:30px 30px 0 0;
    background:#f5efe7;
    z-index:151;
}

.sheet-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.sheet-head h2{
    margin:0;
}

.close{
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:#e9ded3;
    font-size:22px;
}

.cart-item{
    margin-top:11px;
    padding:13px;
    border-radius:17px;
    background:#fffaf5;
    display:flex;
    align-items:center;
    gap:11px;
}

.cart-item-emoji{
    font-size:36px;
}

.cart-item-info{
    flex:1;
}

.cart-item-info strong{
    display:block;
}

.cart-item-info small{
    color:#9a897b;
}

.qty{
    display:flex;
    align-items:center;
    gap:8px;
}

.qty button{
    width:30px;
    height:30px;
    border:0;
    border-radius:50%;
    background:#4a2b1d;
    color:white;
    font-size:17px;
}

.checkout{
    width:100%;
    margin-top:15px;
    border:0;
    border-radius:16px;
    padding:15px;
    background:#4a2b1d;
    color:white;
    font-size:15px;
    font-weight:800;
}


/* =========================
   شاشات الطلب
========================= */

.fullscreen{
    position:fixed;
    inset:0;
    z-index:300;
    overflow-y:auto;
    background:#f5efe7;
}

.order-form{
    width:min(560px,100%);
    min-height:100vh;
    margin:auto;
    padding:30px 20px 50px;
}

.order-head{
    display:flex;
    align-items:center;
    gap:15px;
    margin-bottom:35px;
}

.order-head h2{
    margin:0;
    font-size:30px;
}

.order-head button{
    width:43px;
    height:43px;
    border:0;
    border-radius:50%;
    background:#e9ded3;
    font-size:23px;
}

.order-form label{
    display:block;
    margin-bottom:22px;
    font-size:17px;
    font-weight:700;
}

.order-form input,
.order-form textarea{
    display:block;
    width:100%;
    margin-top:9px;
    padding:15px;
    border:1px solid #dfd1c5;
    border-radius:16px;
    outline:none;
    background:#fffaf5;
    color:#302720;
    font-size:16px;
}

.order-form textarea{
    min-height:125px;
    resize:vertical;
}

.confirm-order{
    width:100%;
    border:0;
    border-radius:17px;
    padding:16px;
    background:#4a2b1d;
    color:white;
    font-size:16px;
    font-weight:800;
}


/* =========================
   تأكيد الطلب
========================= */

.confirmation-card{
    width:min(520px,calc(100% - 30px));
    margin:55px auto;
    padding:30px 22px;
    border-radius:30px;
    background:#fffaf5;
    text-align:center;
    box-shadow:0 15px 40px rgba(70,45,25,.09);
}

.success-check{
    width:68px;
    height:68px;
    margin:auto;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:#e4f1e5;
    color:#4d9658;
    font-size:36px;
    font-weight:800;
}

.success-label{
    margin-top:16px;
    color:#4d9658;
    font-weight:800;
    letter-spacing:1px;
}

.confirmation-card h2{
    margin:10px 0;
    font-size:30px;
}

.order-number{
    display:inline-block;
    margin:10px 0 20px;
    padding:12px 23px;
    border-radius:15px;
    background:#eee3d7;
    font-size:23px;
    font-weight:800;
}

.order-details{
    text-align:right;
}

.order-details p{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    padding:12px 0;
    margin:0;
    border-bottom:1px solid #eadfd5;
    font-size:13px;
}

.track-order{
    width:100%;
    margin-top:22px;
    border:0;
    border-radius:16px;
    padding:15px;
    background:#4a2b1d;
    color:white;
    font-size:15px;
    font-weight:800;
}


/* =========================
   التتبع
========================= */

.tracking-logo{
    font-size:55px;
    font-weight:800;
}

.tracking-number{
    display:inline-block;
    margin:10px 0 20px;
    padding:11px 22px;
    border-radius:14px;
    background:#eee3d7;
    font-size:22px;
    font-weight:800;
}

.steps{
    margin-top:15px;
    text-align:right;
}

.step{
    display:flex;
    align-items:center;
    gap:14px;
    padding:15px 0;
    color:#aaa;
}

.step-circle{
    width:40px;
    height:40px;
    flex-shrink:0;
    border-radius:50%;
    background:#e7ddd3;
    display:grid;
    place-items:center;
    font-weight:800;
}

.step.done{
    color:#4d9658;
    font-weight:800;
}

.step.done .step-circle{
    background:#4d9658;
    color:white;
}

.step.current{
    color:#4a2b1d;
    font-weight:800;
}

.step.current .step-circle{
    background:#4a2b1d;
    color:white;
}


/* =========================
   الجوال
========================= */

@media(max-width:560px){

    .brand h1{
        font-size:70px;
    }

    .splash-logo{
        font-size:90px;
    }

    .products{
        grid-template-columns:1fr 1fr;
    }

    .product-img{
        height:125px;
        font-size:57px;
    }

    .hero h2{
        font-size:25px;
    }

}

/* =========================
   فتح المنيو
========================= */

function openMenu(selectedMode){

    mode = selectedMode;

    document
        .getElementById("home")
        .classList.add("hidden");

    document
        .getElementById("app")
        .classList.remove("hidden");

    renderCategories();

    renderProducts();

}


/* =========================
   التصنيفات
========================= */

function renderCategories(){

    const list =
        language === "ar"
        ? categories.ar
        : categories.en;

    document.getElementById("categories").innerHTML =

        list.map(category => `

            <button
                class="cat ${category[0] === currentCategory ? "active" : ""}"
                onclick="selectCategory('${category[0]}')"
            >

                ${category[1]}
                ${category[2]}

            </button>

        `).join("");

}


function selectCategory(category){

    currentCategory = category;

    renderCategories();

    renderProducts();

}


/* =========================
   المنتجات
========================= */

function renderProducts(){

    const items =
        products.filter(
            product => product.cat === currentCategory
        );

    document.getElementById("products").innerHTML =

        items.map(product => `

            <article class="product">

                <div class="product-img">
                    ${product.emoji}
                </div>

                <div class="info">

                    <div class="name">
                        ${language === "ar"
                            ? product.ar
                            : product.en}
                    </div>

                    <div class="desc">
                        ${language === "ar"
                            ? product.descAr
                            : product.descEn}
                    </div>

                    <div class="bottom">

                        <span class="price">

                            ${product.price.toFixed(3)}

                            ${language === "ar"
                                ? "ر.ع"
                                : "OMR"}

                        </span>

                        <button
                            class="add"
                            onclick="addToCart(${product.id})"
                        >
                            +
                        </button>

                    </div>

                </div>

            </article>

        `).join("");

}


/* =========================
   إضافة للسلة
========================= */

function addToCart(id){

    const item =
        cart.find(
            product => product.id === id
        );

    if(item){

        item.qty++;

    }else{

        cart.push({
            id:id,
            qty:1
        });

    }

    updateCart();

}


/* =========================
   تحديث السلة
========================= */

function updateCart(){

    const count =
        cart.reduce(
            (total,item) =>
                total + item.qty,
            0
        );

    const total =
        cart.reduce(
            (sum,item) => {

                const product =
                    products.find(
                        p => p.id === item.id
                    );

                return sum +
                    product.price *
                    item.qty;

            },
            0
        );


    document.getElementById("cartCount")
        .textContent = count;


    document.getElementById("cartTotal")
        .textContent =
            total.toFixed(3)
            + " "
            + (language === "ar"
                ? "ر.ع"
                : "OMR");


    document.getElementById("sheetTotal")
        .textContent =
            total.toFixed(3)
            + " "
            + (language === "ar"
                ? "ر.ع"
                : "OMR");


    document.getElementById("cartBar")
        .classList.toggle(
            "hidden",
            count === 0
        );


    renderCartItems();

}


/* =========================
   عناصر السلة
========================= */

function renderCartItems(){

    const box =
        document.getElementById("cartItems");


    if(cart.length === 0){

        box.innerHTML = `

            <p style="
                text-align:center;
                color:#9a897b;
                padding:20px;
            ">

                ${
                    language === "ar"
                    ? "السلة فارغة"
                    : "Your cart is empty"
                }

            </p>

        `;

        return;

    }


    box.innerHTML =

        cart.map(item => {

            const product =
                products.find(
                    p => p.id === item.id
                );


            return `

                <div class="cart-item">

                    <div class="cart-item-emoji">
                        ${product.emoji}
                    </div>

                    <div class="cart-item-info">

                        <strong>
                            ${
                                language === "ar"
                                ? product.ar
                                : product.en
                            }
                        </strong>

                        <small>

                            ${
                                (
                                    product.price *
                                    item.qty
                                ).toFixed(3)
                            }

                            ${
                                language === "ar"
                                ? "ر.ع"
                                : "OMR"
                            }

                        </small>

                    </div>


                    <div class="qty">

                        <button
                            onclick="changeQty(${product.id},-1)"
                        >
                            −
                        </button>

                        <span>
                            ${item.qty}
                        </span>

                        <button
                            onclick="changeQty(${product.id},1)"
                        >
                            +
                        </button>

                    </div>

                </div>

            `;

        }).join("");

}


/* =========================
   تغيير الكمية
========================= */

function changeQty(id,amount){

    const item =
        cart.find(
            product => product.id === id
        );

    if(!item){
        return;
    }


    item.qty += amount;


    if(item.qty <= 0){

        cart =
            cart.filter(
                product => product.id !== id
            );

    }


    updateCart();

}


/* =========================
   فتح السلة
========================= */

function openCart(){

    document
        .getElementById("overlay")
        .classList.remove("hidden");

    document
        .getElementById("cartSheet")
        .classList.remove("hidden");

    renderCartItems();

}


/* =========================
   إغلاق السلة
========================= */

function closeCart(){

    document
        .getElementById("overlay")
        .classList.add("hidden");

    document
        .getElementById("cartSheet")
        .classList.add("hidden");

}


/* =========================
   إتمام الطلب
========================= */

function checkout(){

    if(cart.length === 0){
        return;
    }

    closeCart();

    renderOrderForm();

    document
        .getElementById("orderFormScreen")
        .classList.remove("hidden");

}


/* =========================
   بيانات الطلب
========================= */

        mode === "cafe";


    document.getElementById("orderFormScreen").innerHTML = `

        <div class="order-form">

            <div class="order-head">

                <button

                    ×
                </button>

                <h2>

                    ${
                        language === "ar"

                </h2>

                <label>

/* =========================
   إغلاق بيانات الطلب
========================= */

function closeOrderForm(){

    document
        .getElementById("orderFormScreen")
        .classList.add("hidden");

}


/* =========================
   تأكيد الطلب
========================= */

function confirmOrder(){

    const table =
        document.getElementById("orderTable");

    const car =
        document.getElementById("orderCar");

    const phone =
        document.getElementById("orderPhone");

    const note =
        document.getElementById("orderNote");


    if(
        mode === "cafe" &&
        !table.value.trim()
    ){

        alert(
            language === "ar"
            ? "املأ رقم الطاولة أولاً"
            : "Enter the table number first"
        );

        return;

    }


    if(
        mode === "car" &&
        !car.value.trim()
    ){

        alert(
            language === "ar"
            ? "املأ رقم السيارة أولاً"
            : "Enter the vehicle number first"
        );

        return;

    }


    if(!phone.value.trim()){

        alert(
            language === "ar"
            ? "املأ رقم الهاتف أولاً"
            : "Enter the phone number first"
        );

        return;

    }


    order = {

        number:
            "B" +
            Math.floor(
                10000 +
                Math.random() * 90000
            ),

        mode:mode,

        table:
            table
            ? table.value.trim()
            : "",

        car:
            car
            ? car.value.trim()
            : "",

        phone:
            phone.value.trim(),

        note:
            note.value.trim(),

        status:"received"

    };


    localStorage.setItem(
        "barniOrder",
        JSON.stringify(order)
    );


    cart = [];

    updateCart();

    closeOrderForm();

    showConfirmation();

}


/* =========================
   صفحة التأكيد
========================= */

function showConfirmation(){

    document.getElementById("confirmationScreen").innerHTML = `

        <div class="confirmation-card">

                        }
                    </strong>

                    <span>
                        #${order.number}
                    </span>

                </p>


                <p>

                    <strong>

                        ${
                            cafe
                            ? (
                                language === "ar"
                                ? "رقم الطاولة"
                                : "Table Number"
                            )
                            :
                            (
                                language === "ar"
                                ? "رقم السيارة"

                            )
                        }

                    </strong>

                    <span>

                        ${
                            cafe

                            : order.car
                        }

                    </span>

                </p>


                <p>

                    <strong>

                        ${
                            language === "ar"
                            ? "رقم الهاتف"
                            : "Phone Number"
                        }

                    </strong>

                    <span>
                        ${order.phone}
                    </span>

                </p>


                <p>

                    <strong>

                        ${
                            language === "ar"
                            ? "الملاحظة"
                            : "Note"
                        }

                    </strong>

                    <span>

                        ${
                            order.note

                                language === "ar"

                        }

                    </span>

                </p>


            </div>


            <button
                type="button"
                class="track-order"
                onclick="showTracking()"
            >

                ${
                    language === "ar"
                    ? "رؤية طلبك"
                    : "View Your Order"
                }

            </button>

        </div>

    `;


    document
        .getElementById("confirmationScreen")
        .classList.remove("hidden");

}


/* =========================
   تتبع الطلب
========================= */

function showTracking(){

    const statuses = [

        "received",
        "preparing",
        "ready",
        "delivered"

    ];


    const current =
        statuses.indexOf(
            order.status
        );


    const labels =
        language === "ar"

        ?

        [
            "تم استلام الطلب",
            "جاري التحضير",
            "جاهز",
            "تم التسليم"
        ]

        :

        [
            "Order Received",
            "Preparing",
            "Ready",
            "Delivered"
        ];


    document.getElementById("confirmationScreen").innerHTML = `

        <div class="confirmation-card">

            <div class="tracking-logo">
                برني
            </div>


            <h2>

                ${
                    language === "ar"
                    ? "تتبع طلبك"
                    : "Track Your Order"
                }

            </h2>


            <div class="tracking-number">

                #${order.number}

            </div>


            <div class="steps">


                ${

                    labels.map(
                        (label,index) => `

                            <div class="step

                                ${
                                    index < current
                                    ? "done"
                                    : index === current
                                    ? "current"
                                    : ""
                                }

                            ">

                                <div class="step-circle">

                                    ${
                                        index < current
                                        ? "✓"
                                        : index + 1
                                    }

                                </div>

                                <span>
                                    ${label}
                                </span>

                            </div>

                        `
                    ).join("")

                }


            </div>

        </div>

    `;

}


/* =========================
   تغيير اللغة
========================= */

function toggleLanguage(){

    language =
        language === "ar"
        ? "en"
        : "ar";


    document.documentElement.lang =
        language;


    document.documentElement.dir =
        language === "ar"
        ? "rtl"
        : "ltr";


    document.getElementById("langBtn")
        .textContent =
            language === "ar"
            ? "EN"
            : "AR";


    document.getElementById("menuTitle")
        .textContent =
            language === "ar"
            ? "منيو برني"
            : "Barni Menu";


    document.getElementById("menuSubtitle")
        .textContent =
            language === "ar"
            ? "اختر قهوتك المفضلة"
            : "Choose your favorite coffee";


    document.getElementById("viewCart")
        .textContent =
            language === "ar"
            ? "السلة"
            : "Cart";


    document.getElementById("cartTitle")
        .textContent =
            language === "ar"
            ? "السلة"
            : "Cart";


    document.getElementById("totalText")
        .textContent =
            language === "ar"
            ? "المجموع"
            : "Total";


    document.getElementById("checkoutBtn")
        .textContent =
            language === "ar"
            ? "إتمام الطلب"
            : "Checkout";


    renderCategories();

    renderProducts();

    updateCart();

}
