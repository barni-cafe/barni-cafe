<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>طلبات برني كافيه</title>
<link rel="stylesheet" href="style.css">
<style>
body{padding:30px}.admin{max-width:1200px;margin:auto}.admin-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.orders{display:grid;gap:14px}.order{background:#fffaf3;border:1px solid #e8d6c1;border-radius:20px;padding:20px}.order-top{display:flex;justify-content:space-between;gap:15px}.badge{background:#4b2b1d;color:#fff;padding:6px 12px;border-radius:999px;font-size:12px}.muted{color:#9b806e}.items{margin-top:12px;padding-top:12px;border-top:1px solid #e8d6c1}.refresh{border:0;background:#4b2b1d;color:#fff;border-radius:14px;padding:12px 18px}
</style>
</head>
<body>
<div class="admin">
  <div class="admin-head">
    <div><div class="mini-brand">برني</div><h1>الطلبات</h1></div>
    <button id="refresh" class="refresh">تحديث الطلبات</button>
  </div>
  <div id="orders" class="orders"></div>
</div>
<script>
const URL="https://yxojtouxwoztjwtmzbys.supabase.co";
const KEY="sb_publishable_G4P7-79B7uwYO-xe5fsBTA_7VK7BxQ-";
async function load(){
  const box=document.getElementById("orders");
  box.innerHTML="<p class='muted'>جاري تحميل الطلبات...</p>";
  if(!window.supabase){
    await new Promise((res,rej)=>{let s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";s.onload=res;s.onerror=rej;document.head.appendChild(s)});
  }
  const client=window.supabase.createClient(URL,KEY);
  const {data,error}=await client.from("orders").select("*").order("created_at",{ascending:false});
  if(error){box.innerHTML="<p>تعذر تحميل الطلبات. تحقق من صلاحيات القراءة في Supabase.</p>";console.error(error);return}
  if(!data?.length){box.innerHTML="<p class='muted'>لا توجد طلبات حالياً.</p>";return}
  box.innerHTML=data.map(o=>{
    const items=Array.isArray(o.items)?o.items:[];
    return `<article class="order">
      <div class="order-top"><strong>${o.order_number||"-"}</strong><span class="badge">${o.status||"new"}</span></div>
      <p class="muted">${o.created_at?new Date(o.created_at).toLocaleString("ar-OM"):""}</p>
      <div><strong>الطاولة/المسار:</strong> ${o.table_number||"-"} &nbsp; <strong>الجوال:</strong> ${o.phone||"-"}</div>
      <div class="items">${items.map(i=>`${i.name} × ${i.quantity}`).join("، ")}</div>
      <p><strong>الإجمالي:</strong> ${Number(o.total||0).toFixed(3)} ر.ع</p>
      <p class="muted">${o.notes||""}</p>
    </article>`
  }).join("");
}
document.getElementById("refresh").onclick=load;
load();
</script>
</body>
</html>
