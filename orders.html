<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طلبات برني كافيه</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #f5f0e8;
  color: #2b211b;
  padding: 20px;
}

h1 {
  text-align: center;
}

#orders {
  max-width: 800px;
  margin: auto;
}

.order {
  background: white;
  border-radius: 16px;
  padding: 20px;
  margin: 15px 0;
  box-shadow: 0 4px 15px #0002;
}

.item {
  padding: 8px 0;
  border-bottom: 1px solid #eee;
}

.error {
  color: red;
  text-align: center;
}
</style>
</head>

<body>

<h1>☕ طلبات برني كافيه</h1>

<div id="orders">
  جاري تحميل الطلبات...
</div>

<script>

const SUPABASE_URL =
"https://yxojtouxwoztjwtmzbys.supabase.co";

const SUPABASE_KEY =
"sb_publishable_G4P7-79B7uwYO-xe5fsBTA_7VK7BxQ-";

async function loadOrders() {

  const response = await fetch(
    SUPABASE_URL + "/rest/v1/orders?select=*&order=created_at.desc",
    {
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY
      }
    }
  );

  const orders = await response.json();

  const box = document.getElementById("orders");

  if (!orders.length) {
    box.innerHTML = "<p>ما فيه طلبات حاليًا ☕</p>";
    return;
  }

  box.innerHTML = orders.map(order => {

    let items = order.items || [];

    if (typeof items === "string") {
      try {
        items = JSON.parse(items);
      } catch {
        items = [];
      }
    }

    return `
      <div class="order">

        <h2>🧾 طلب #${order.id}</h2>

        <p>🪑 الطاولة: ${order.table_number || "غير محددة"}</p>

        <p>👤 العميل: ${order.customer_name || "غير مسجل"}</p>

        <h3>☕ المنتجات:</h3>

        ${
          Array.isArray(items)
          ? items.map(item => `
              <div class="item">
                ${item.name || "منتج"} × ${item.quantity || 1}
              </div>
            `).join("")
          : ""
        }

      </div>
    `;

  }).join("");
}

loadOrders();

</script>

</body>
</html>
